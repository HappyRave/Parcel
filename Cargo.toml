[workspace]
members = ["crates/parcel-core", "crates/parcel-ipc", "crates/parcel-service", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
parcel-core = { path = "crates/parcel-core" }
parcel-ipc = { path = "crates/parcel-ipc", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = "1.54.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
